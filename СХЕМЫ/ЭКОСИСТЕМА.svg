<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
<title id="title">Карта экосистемы GeraK</title>
<desc id="desc">Логическая карта экосистемы GeraK и группы GeraKStore</desc>
<rect width="1400" height="820" rx="36" fill="#0b0d10"/>
<text x="80" y="92" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="42" font-weight="700">GeraK</text>
<text x="80" y="132" fill="#9aa3ad" font-family="Inter,Arial,sans-serif" font-size="20">Логическая карта экосистемы</text>

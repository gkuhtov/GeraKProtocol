<text x="220" y="258" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="700">GeraKNetwork</text>
<text x="220" y="291" text-anchor="middle" fill="#9aa3ad" font-family="Inter,Arial,sans-serif" font-size="17">сервис</text>
<rect x="400" y="205" width="280" height="120" rx="24" fill="#15191f" stroke="#3b424d"/>
<text x="540" y="258" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="700">GeraKLab</text>
<text x="540" y="291" text-anchor="middle" fill="#9aa3ad" font-family="Inter,Arial,sans-serif" font-size="17">продукт</text>
<rect x="720" y="180" width="600" height="390" rx="32" fill="#11151a" stroke="#59616d"/>
<text x="760" y="232" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="700">GeraKStore</text>
<text x="760" y="265" fill="#9aa3ad" font-family="Inter,Arial,sans-serif" font-size="17">инфраструктура и связанные компоненты</text>
<rect x="760" y="310" width="240" height="95" rx="20" fill="#181d23" stroke="#3b424d"/>
<text x="880" y="365" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="600">GeraKStore-Web</text>
<rect x="1020" y="310" width="240" height="95" rx="20" fill="#181d23" stroke="#3b424d"/>
<text x="1140" y="365" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="600">GeraKStore-Welcome</text>
<rect x="890" y="435" width="240" height="95" rx="20" fill="#181d23" stroke="#3b424d"/>
<text x="1010" y="480" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="600">GeraKStore-Manager</text>
<rect x="80" y="405" width="280" height="120" rx="24" fill="#15191f" stroke="#3b424d"/>
<text x="220" y="458" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="700">GeraKWonderAlice</text>
<text x="220" y="491" text-anchor="middle" fill="#9aa3ad" font-family="Inter,Arial,sans-serif" font-size="17">эксперимент</text>
<path d="M360 265H400M680 265H720M360 465H720M1020 310V275H1040M1140 310V275H1080M1010 435V405" fill="none" stroke="#68717d" stroke-width="3"/>
<text x="80" y="690" fill="#9aa3ad" font-family="Inter,Arial,sans-serif" font-size="18">Стрелки показывают логическую принадлежность, а не обязательную техническую зависимость.</text>
<text x="80" y="735" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600">GeraKProtocol документирует карту, но не становится её runtime-зависимостью.</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
<title id="title">Архитектурная модель GeraK</title>
<desc id="desc">Три уровня связей в экосистеме GeraK</desc>
<rect width="1400" height="760" rx="36" fill="#0b0d10"/>
<text x="80" y="92" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="42" font-weight="700">Архитектура GeraK</text>
<text x="80" y="132" fill="#9aa3ad" font-family="Inter,Arial,sans-serif" font-size="20">Связь не всегда означает зависимость</text>
<g font-family="Inter,Arial,sans-serif">
<rect x="80" y="205" width="1240" height="125" rx="26" fill="#15191f" stroke="#59616d"/>
<text x="125" y="252" fill="#fff" font-size="28" font-weight="700">01 · Принадлежность</text>
<text x="125" y="290" fill="#aab2bc" font-size="18">Проекты находятся внутри общей экосистемы GeraK.</text>
<text x="1160" y="275" fill="#fff" font-size="42" font-weight="700">GeraK</text>
<rect x="80" y="365" width="1240" height="125" rx="26" fill="#15191f" stroke="#59616d"/>
<text x="125" y="412" fill="#fff" font-size="28" font-weight="700">02 · Функциональная связь</text>
<text x="125" y="450" fill="#aab2bc" font-size="18">Проекты могут решать связанные задачи и образовывать общий сценарий.</text>
<text x="1160" y="437" fill="#fff" font-size="42" font-weight="700">↔</text>
<rect x="80" y="525" width="1240" height="125" rx="26" fill="#15191f" stroke="#59616d"/>
<text x="125" y="572" fill="#fff" font-size="28" font-weight="700">03 · Техническая зависимость</text>
<text x="125" y="610" fill="#aab2bc" font-size="18">Только здесь речь идёт об импорте, package, library или runtime dependency.</text>
<text x="1158" y="603" fill="#fff" font-size="42" font-weight="700">→</text>
</g>
<text x="80" y="705" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600">GeraKProtocol находится вне программного графа зависимостей.</text>
</svg>